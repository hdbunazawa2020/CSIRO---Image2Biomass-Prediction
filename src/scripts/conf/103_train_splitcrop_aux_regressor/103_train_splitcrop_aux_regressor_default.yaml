# ==========
# general
# ==========
exp: 103_train_exp045
# TODO: 実験連番
seed: 1129
debug: false
device: cuda
use_amp: true
num_workers: 12
pin_memory: true
persistent_workers: true
# WandB
use_wandb: true
competition: Csiro-Image2BiomassPrediction
author: hidebu
wandb_log_interval_steps: 100
# DDP
ddp:
  enabled: true
  backend: nccl
  find_unused_parameters: true

# ==========
# paths
# ==========
input_dir: /mnt/nfs/home/hidebu/study/CSIRO---Image2Biomass-Prediction/data/raw
pp_dir: /mnt/nfs/home/hidebu/study/CSIRO---Image2Biomass-Prediction/data/processed
preprocess_ver: 001_preprocess_ver04
pivot_csv_name: df_pivot.csv

output_dir: /mnt/nfs/home/hidebu/study/CSIRO---Image2Biomass-Prediction/experiments

# ==========
# CV
# ==========
fold_col: Fold
folds: [0,1,2]

# =======================================
# targets (order MUST match metric.py)
# =======================================
target_cols:
  - Dry_Green_g
  - Dry_Clover_g
  - Dry_Dead_g
  - GDM_g
  - Dry_Total_g

use_log1p_target: true

# =======================
# image / augmentation
# =======================
img_h: 320
img_w: 320
use_split_crop: true
crop_size: 768
normalize:
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

augment:
  train:
    hflip_p: 0.5
    vflip_p: 0.0 # 0.0
    rotate90_p: 0.25
    shift_scale_rotate_p: 0.10
    color_jitter_p: 0.20

    coarse_dropout_p: 0.15
    coarse_dropout_max_holes: 16
    coarse_dropout_min_h: 16
    coarse_dropout_min_w: 16
    coarse_dropout_max_h: 64
    coarse_dropout_max_w: 64

    tile_shuffle_p: 0.1 # 0.0
    tile_shuffle_gh: 2
    tile_shuffle_gw: 2

    blur_noise_p: 0.05 # 0.0

  valid:
    dummy: 0

# ==========================
# MixUp / CutMix (train only)
# ==========================
mixing:
  enabled: false
  p: 0.14075341328864174
  mode: cutmix
  mixup_alpha: 1.0
  cutmix_alpha: 1.0
  switch_prob: 0.5

# ==========
# model
# ==========
model:
  backbone: convnext_small
  pretrained: true
  in_chans: 3
  drop_rate: 0.0
  drop_path_rate: 0.1
  head_dropout: 0.0
  fuse: concat
  aux_hidden_dim: 256
  aux_dropout: 0.1
  components_mode: true

aux:
  enabled: true
  warmup_epochs: 5

  species:
    enabled: true
    col: Species
    weight: 0.03
    label_smoothing: 0.05
    ignore_index: -1

  states:
    enabled: true
    col: State
    weight: 0.03
    label_smoothing: 0.05
    ignore_index: -1

  ndvi:
    enabled: true
    col: Pre_GSHH_NDVI
    weight: 0.02
    loss: huber
    beta: 0.1

  height:
    enabled: true
    col: Height_Ave_cm
    weight: 0.02
    loss: huber
    beta: 5.0

# ==========
# training
# ==========
train:
  epochs: 400
  batch_size: 20
  grad_accum_steps: 1
  max_norm: 3.0
  log_interval: 50
  val_interval: 1

early_stopping:
  enabled: true
  patience: 1000
  min_delta: 0.0

ema:
  enabled: true
  decay: 0.99

# =========================
# optimizer & scheduler
# =========================
optimizer:
  name: adamw
  base_lr: 0.0000280
  weight_decay: 0.0000023
  betas: [0.9, 0.999]

scheduler:
  name: warmup_cosine
  base_lr: 0.0000280
  max_lr: 0.0000280
  min_lr: 0.0000280
  warmup_ratio: 0.05
  warmup_steps: null
  total_steps: null

# ===================================================
# loss / metric weights (same order as target_cols)
# ===================================================
loss:
  name: mixed_log_raw
  weights: [0.1, 0.1, 0.1, 0.0, 0.0]

  # ★ Run2: alpha_rawを下げて比較
  alpha_raw: 0.05
  alpha_warmup_epochs: 0

  raw_loss: huber
  raw_huber_beta: 20

  log_clip_min: -20.0
  log_clip_max: 20.0

metric:
  name: weighted_r2
  weights: [0.1, 0.1, 0.1, 0.2, 0.5]